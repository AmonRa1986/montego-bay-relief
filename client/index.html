<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="%VITE_APP_LOGO%" />
    <link rel="apple-touch-icon" href="%VITE_APP_LOGO%" />
    <title>%VITE_APP_TITLE%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  </head>

  <body>
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      // Handle redirects from 404.html
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    
    <!-- Progress Bar Animation -->
    <script>
      window.addEventListener('load', function() {
        // Update these values as donations come in
        var raised = 3795;
        var goal = 25000;
        var percentage = Math.min((raised / goal) * 100, 100);
        
        var raisedEl = document.getElementById('raised');
        var percentEl = document.getElementById('percent');
        var progressBarEl = document.getElementById('progressBar');
        
        if (raisedEl && percentEl && progressBarEl) {
          raisedEl.textContent = raised.toLocaleString();
          percentEl.textContent = Math.round(percentage);
          
          setTimeout(function() {
            progressBarEl.style.width = percentage + '%';
          }, 500);
        }
      });
    </script>
  </body>

</html>
